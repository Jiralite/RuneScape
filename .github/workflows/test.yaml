name: Test
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1.

      - name: Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2.
        with:
          install: false

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Check code quality
        run: pnpm run lint:ci

      - name: Run tests
        run: pnpm run test
  typographical-errors:
    name: Typographical errors
    runs-on: ubuntu-latest
    steps:
      - *checkout

      - name: Scan for typographical errors
        uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0.
